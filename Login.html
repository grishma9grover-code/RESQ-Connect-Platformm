<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQ Connect - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: url("Rescue Watch Over the Sunset Valley.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* Centers the login box on any screen size */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            background: rgba(7, 30, 58, 0.85);
            backdrop-filter: blur(10px); /* Frosted glass effect */
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            color: white;
        }

        .box h2 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
        }

        .input-group input::placeholder {
            color: #94a3b8;
        }

        .input-group input:focus {
            border-color: #ef4444;
            background: rgba(255, 255, 255, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            background-color: #e11d48;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        .login-btn:hover {
            background-color: #be123c;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            margin: 25px 0;
        }

        .signup-text {
            text-align: center;
            font-size: 14px;
            color: #cbd5e1;
        }

        .signup-text a {
            color: #f87171;
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Welcome to ResQ Connect</h2>
        <p class="subtitle">Login to continue</p>

        <form onsubmit="loginUser(event)">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" minlength="8" maxlength="15" required>
            </div>

            <button type="submit" class="login-btn">Login</button>

            <hr>

            <p class="signup-text">
                Don't have an account? <a href="Signup.html">Sign Up</a>
            </p>
        </form>
    </div>

    <script src="connect.js"></script>
</body>
</html>
